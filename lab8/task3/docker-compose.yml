version: '3.8'

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    image: python:3.11-slim
    depends_on:
      - minio
    volumes:
      - .:/app
    working_dir: /app
    command: python hybrid_storage.py
    stdin_open: true
    tty: true

volumes:
  minio_data: