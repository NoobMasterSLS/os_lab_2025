version: '3.8'
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ':9001'
    user: "0:0"
    volumes:
      - minio_data:/data
volumes:
  minio_data: